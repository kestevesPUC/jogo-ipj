services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/dev.db
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env antes de subir o container}
    volumes:
      - quiz-db:/app/data
      - quiz-uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  quiz-db:
  quiz-uploads:
